<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>算数インベーダー 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#050b18;color:#eaf7ff;font-family:system-ui,sans-serif}button,select{font:inherit;cursor:pointer}button{color:inherit;border:1px solid #36516a;background:#14273d;border-radius:12px;padding:12px 18px}button:active{transform:scale(.97)}button:focus-visible,select:focus-visible{outline:3px solid #78f8d0}header{height:65px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #233348}h1{font-size:19px;margin:0}small{color:#83a5be;font-size:11px;letter-spacing:2px}.hud{display:flex;gap:22px;font-weight:bold}.shell{max-width:1250px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 290px;height:calc(100dvh - 65px);padding:16px;gap:16px}.arena{position:relative;min-height:280px;overflow:hidden;border:1px solid #294054;border-radius:20px;background:#07111f}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:18px;left:20px;color:#85efd5;font-size:12px;letter-spacing:2px}.status{position:absolute;bottom:22px;width:100%;text-align:center;font-weight:bold;text-shadow:0 2px 8px #000}.panel{display:flex;flex-direction:column;gap:14px;overflow:auto}.card{border:1px solid #294054;border-radius:16px;padding:16px;background:#0d1929}.label{font-size:12px;color:#99b7ce;margin-bottom:8px;display:block}.settings{display:grid;gap:12px}select{width:100%;padding:10px;border:1px solid #36516a;border-radius:8px;background:#15283d;color:white}.primary{background:#8cf5d2;color:#052c28;border:0;font-weight:800;width:100%}.mic{width:100%;border-color:#5bbaa6}.mic.on{background:#183e3b;color:#8cf5d2}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keypad button{padding:9px}.answer{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:24px;min-height:30px}.hint{font-size:12px;line-height:1.7;color:#a8bbcb;margin:0}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#041 </style><header><div><small>VOICE DEFENSE / 01</small><h1>算数インベーダー 3D</h1></div><div class="hud"><span>撃退 <b id="score">0</b>/10</span><span id="lives">♥ ♥ ♥</span><button id="pause" style="padding:7px 10px">一時停止</button></div></header><main class="shell"><section class="arena"><canvas id="view" aria-label="奥から敵が迫ってくる宇宙空間"></canvas><div class="badge">SECTOR 07 · 計算で地球を守ろう</div><div class="status" id="status" aria-live="polite">答えを声に出して、撃退！</div><div class="overlay" id="overlay"><div class="intro"><small>MATH INVADERS</small><h2 id="title">声が、武器になる。</h2><p id="description">迫ってくる敵の問題を解こう。<br>答えを言うと、レーザー発射！<br>10体撃退でミッションクリア。</p><button class="primary" id="start">ミッション開始</button></div></div></section><aside class="panel"><div class="card"><div class="settings" id="settings"><label><span class="label">数のはんい</span><select id="range"><option value="10">10まで</option><option value="20">20まで</option></select></label><label><span class="label">問題</span><select id="mode"><option value="mix">たし算 ＋ ひき算</option><option value="add">たし算</option><option value="sub">ひき算</option></select></label><label><span class="label">敵の速さ</span><select id="speed"><option value="40">ゆっくり（40秒）</option><option value="25">ふつう（25秒）</option><option value="15">はやい（15秒）</option></select></label></div><button class="mic" id="mic" style="margin-top:12px">🎙 音声をオン</button><p class="hint" id="heard" style="margin-top:8px" aria-live="polite">音声をオンにして、マイクを許可してください。</p><button id="sound" style="margin-top:8px;padding:6px 10px;font-size:12px">効果音：オン</button></div><div class="card"><span class="label">ボタンでも答えられます</span><div class="answer"><output id="answer">—</output><button id="erase" style="font-size:12px;padding:6px">消す</button></div><div class="keypad" id="keys"></div><button class="primary" id="fire" style="margin-top:8px;padding:10px">こたえる →</button></div><p class="hint">足し算は答えが選んだ数まで。引き算は引かれる数が選んだ数までで、答えは0以上です。設定は次のゲームに反映されます。音声認識には対応ブラウザと通信が必要です。</p></aside></main><script>
'use strict';
const $=id=>document.getElementById(id),c=$('view'),ctx=c.getContext('2d');let w=800,h=650,playing=false,paused=false,score=0,lives=3,enemy=null,elapsed=0,last=0,fx=0,hit=0,transition=0,typed='',limit=10,mode='mix',duration=40,audio=null,sound=true,wantMic=false,recognition=null,recognizing=false,retry=null;const stars=Array.from({length:120},()=>[Math.random(),Math.random(),Math.random()]);
function resize(){const r=c.getBoundingClientRect();w=r.width;h=r.height;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}new ResizeObserver(resize).observe(c);
function tone(freq,len=.14){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.45,audio.currentTime+len);g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.start();o.stop(audio.currentTime+len)}catch(e){}}
function question(){const add=mode==='add'||(mode==='mix'&&Math.random()<.5);let a,b;if(add){a=Math.floor(Math.random()*limit)+1;b=Math.floor(Math.random()*(limit-a+1))}else{a=Math.floor(Math.random()*limit)+1;b=Math.floor(Math.random()*(a+1))}enemy={text:`${a} ${add?'+':'−'} ${b}`,answer:add?a+b:a-b};elapsed=0;typed='';$('answer').textContent='—';$('status').textContent='答えを言って、撃退しよう';}
function hud(){$('score').textContent=score;$('lives').textContent='♥ '.repeat(lives)+'♡ '.repeat(3-lives)}
function finish(win){playing=false;stopMic();$('overlay').classList.remove('hidden');$('title').textContent=win?'ミッションクリア！':'もう一度、挑戦しよう';$('description').textContent=`10体中 ${score}体を撃退！ 設定を変えて、また遊べます。`;$('start').textContent='もう一度あそぶ';$('settings').querySelectorAll('select').forEach(e=>e.disabled=false)}
$('start').onclick=()=>{limit=+$('range').value;mode=$('mode').value;duration=+$('speed').value;score=0;lives=3;paused=false;playing=true;transition=0;fx=0;hit=0;$('pause').textContent='一時停止';$('overlay').classList.add('hidden');$('settings').querySelectorAll('select').forEach(e=>e.disabled=true);hud();question();tone(400);if(wantMic)startMic()};
function submit(n){if(!playing||paused||transition>0||!Number.isInteger(n))return;if(n===enemy.answer){score++;fx=.55;transition=.95;tone(880,.3);$('status').textContent='正解！ インベーダー撃退！';hud()}else{$('status').textContent=`${n} かな？ もう一度考えよう`;tone(160);typed='';$('answer').textContent='—'}}
for(const n of [1,2,3,4,5,6,7,8,9,0]){const b=document.createElement('button');b.textContent=n;if(n===0)b.style.gridColumn='1 / -1';b.onclick=()=>{if(typed.length<2)typed+=n;$('answer').textContent=typed};$('keys').append(b)}$('erase').onclick=()=>{typed='';$('answer').textContent='—'};$('fire').onclick=()=>{if(typed!=='')submit(+typed)};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^\d$/.test(e.key)&&typed.length<2){typed+=e.key;$('answer').textContent=typed}else if(e.key==='Enter')$('fire').click();else if(e.key==='Backspace')$('erase').click()});
function pause(){if(!playing)return;paused=!paused;$('pause').textContent=paused?'再開':'一時停止';$('status').textContent=paused?'一時停止中':'答えを言って、撃退しよう';if(paused)stopMic();else if(wantMic)startMic()}$('pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)pause()});$('sound').onclick=()=>{sound=!sound;$('sound').textContent='効果音：'+(sound?'オン':'オフ')};
const readings=[['ぜろ','れい','零','〇','ゼロ'],['いち','一'],['に','二'],['さん','三'],['よん','し','四'],['ご','五'],['ろく','六'],['なな','しち','七'],['はち','八'],['きゅう','く','九'],['じゅう','十'],['じゅういち','十一'],['じゅうに','十二'],['じゅうさん','十三'],['じゅうよん','じゅうし','十四'],['じゅうご','十五'],['じゅうろく','十六'],['じゅうなな','じゅうしち','十七'],['じゅうはち','十八'],['じゅうきゅう','十九'],['にじゅう','二十']];
function parseNumber(t){t=t.normalize('NFKC').replace(/[\s。、,.!！?？]/g,'').replace(/^(答えは|こたえは)/,'').replace(/(です|だよ)$/,'');if(/^\d{1,2}$/.test(t))return +t;return readings.findIndex(v=>v.includes(t))}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function stopMic(){clearTimeout(retry);if(recognition)try{recognition.abort()}catch(e){}}

if(SR){recognition=new SR();recognition.lang='ja-JP';recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{recognizing=true;$('heard').textContent='聞いています… 答えだけ言ってね';$('mic').classList.add('on')};recognition.onresult=e=>{const t=e.results[0][0].transcript,n=parseNumber(t);$('heard').textContent=`聞こえた声：${t}`;if(n>=0&&n<=20)submit(n);else $('heard').textContent+='（数字だけ、もう一度）'};recognition.onerror=e=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){wantMic=false;$('mic').textContent='🎙 音声をオン';$('heard').textContent='マイクを利用できません。許可を確認するか、数字ボタンで遊べます。'}else if(e.error==='network'){$('heard').textContent='通信を確認してください。数字ボタンでも遊べます。';wantMic=false;$('mic').textContent='🎙 音声をオン'}};recognition.onend=()=>{recognizing=false;$('mic').classList.remove('on');if(wantMic&&playing&&!paused)retry=setTimeout(startMic,450)}}else{$('mic').disabled=true;$('heard').textContent='このブラウザは音声認識に未対応です。数字ボタンで遊べます。'}
$('mic').onclick=()=>{wantMic=!wantMic;$('mic').textContent=wantMic?'🎙 音声をオフ':'🎙 音声をオン';if(wantMic)startMic();else{stopMic();$('heard').textContent='音声オフ：数字ボタンで答えられます。'}};
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function alien(x,y,s,t){ctx.save();ctx.translate(x,y);ctx.scale(s,s);const swing=Math.sin(t*3)*8;ctx.strokeStyle='#254c59';ctx.lineCap='round';for(const side of [-1,1]){for(let i=0;i<3;i++){ctx.lineWidth=13-i;ctx.beginPath();ctx.moveTo(side*52,10+i*17);ctx.lineTo(side*(95+i*9),-8+i*26+swing);ctx.lineTo(side*(110+i*10),48+i*24+swing);ctx.stroke();ctx.strokeStyle='#88aeac';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#254c59'}ctx.fillStyle='#577d7f';ctx.beginPath();ctx.moveTo(side*35,-65);ctx.lineTo(side*70,-110);ctx.lineTo(side*61,-44);ctx.fill()}
let g=ctx.createRadialGradient(-22,-40,3,0,0,90);g.addColorStop(0,'#a1bcb1');g.addColorStop(.35,'#52797b');g.addColorStop(.7,'#223e4c');g.addColorStop(1,'#09131e');ellipse(0,6,67,91,g);ellipse(0,-48,66,48,g);ctx.strokeStyle='#172c36';ctx.lineWidth=4;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-43,-12+i*22);ctx.quadraticCurveTo(0,6+i*22,43,-12+i*22);ctx.stroke()}
ctx.shadowColor='#ff654d';ctx.shadowBlur=18;for(const side of [-1,1]){ctx.fillStyle='#ff9263';ctx.beginPath();ctx.moveTo(side*10,-50);ctx.lineTo(side*49,-64);ctx.lineTo(side*38,-42);ctx.lineTo(side*16,-37);ctx.fill()}ctx.shadowBlur=0;ellipse(0,-23,22,8,'#060d12');ctx.fillStyle='#b9c7bc';for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*7-3,-28);ctx.lineTo(i*7+3,-28);ctx.lineTo(i*7,-20);ctx.fill()}ctx.restore()}
function draw(ts){const dt=Math.min((ts-last)/1000,.05);last=ts;const t=ts/1000;if(playing&&!paused){if(transition>0){transition-=dt;if(transition<=0){if(score>=10)finish(true);else question()}}else{elapsed+=dt;if(elapsed>=duration){lives--;hit=.5;hud();tone(90,.35);if(lives<=0)finish(false);else{question();$('status').textContent='接近された！ 次の敵をねらおう'}}}fx=Math.max(0,fx-dt);hit=Math.max(0,hit-dt)}ctx.clearRect(0,0,w,h);let bg=ctx.createRadialGradient(w/2,h*.38,10,w/2,h*.4,w*.8);bg.addColorStop(0,'#193945');bg.addColorStop(.5,'#091a2a');bg.addColorStop(1,'#030812');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(const [sx,sy,sz]of stars){ctx.fillStyle=`rgba(178,225,243,${.2+sz*.6})`;ctx.fillRect(sx*w,sy*h*.8,1+sz,1+sz)}const horizon=h*.57;ctx.strokeStyle='#24434c';ctx.lineWidth=1;for(let i=-10;i<=10;i++){ctx.beginPath();ctx.moveTo(w/2+i*22,horizon);ctx.lineTo(w/2+i*w*.22,h);ctx.stroke()}for(let i=0;i<10;i++){const yy=horizon+(h-horizon)*Math.pow(i/10,2);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(w,yy);ctx.stroke()}const p=playing?Math.min(elapsed/duration,1):.28;const z=6-4.8*p,scale=Math.min(w/370,h/400)*2/z;const x=w/2+Math.sin(t*.8)*w*.025,y=h*.39+p*h*.12;
if(transition<=0){ellipse(x,y+100*scale,95*scale,14*scale,'#0006');alien(x,y,scale,t);if(playing){const bw=Math.min(w-30,Math.max(150,170*scale)),by=y+90*scale;ctx.fillStyle='#091b2aee';ctx.strokeStyle='#8af4d0';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x-bw/2,by,bw,55,12);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${Math.min(38,25+scale*5)}px system-ui`;ctx.textAlign='center';ctx.fillText(enemy.text+' = ?',x,by+38)}}
if(fx>0){ctx.strokeStyle='#9effe3';ctx.lineWidth=5;ctx.shadowColor='#6fffd1';ctx.shadowBlur=20;for(const sx of [w*.15,w*.85]){ctx.beginPath();ctx.moveTo(sx,h);ctx.lineTo(x,y);ctx.stroke()}for(let i=0;i<20;i++){const a=i*Math.PI/10,r=(.6-fx)*250;ellipse(x+Math.cos(a)*r,y+Math.sin(a)*r,3,3,'#b9ffe3')}ctx.shadowBlur=0}ctx.strokeStyle='#7be6cf66';ctx.lineWidth=1;ctx.beginPath();ctx.arc(w/2,h/2,25,0,Math.PI*2);ctx.moveTo(w/2-35,h/2);ctx.lineTo(w/2-15,h/2);ctx.moveTo(w/2+15,h/2);ctx.lineTo(w/2+35,h/2);ctx.stroke();ctx.fillStyle='#233a50';for(const side of [0,1]){ctx.beginPath();ctx.moveTo(side?w:w*.04,h);ctx.lineTo(side?w*.86:w*.14,h-40);ctx.lineTo(side?w*.79:w*.21,h-40);ctx.lineTo(side?w*.7:w*.3,h);ctx.fill()}if(playing){ctx.fillStyle='#29424e';ctx.fillRect(20,h-8,w-40,3);ctx.fillStyle=p>.75?'#ff947f':'#89f4d3';ctx.fillRect(20,h-8,(w-40)*(1-p),3)}if(hit>0){ctx.fillStyle=`rgba(255,73,70,${hit*.5})`;ctx.fillRect(0,0,w,h)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
